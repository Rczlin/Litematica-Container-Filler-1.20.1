name: Release

on:
  workflow_dispatch:
    inputs:
      isRelease:
        description: 'Create a GitHub release'
        type: boolean
        default: false
      releaseTag:
        description: 'Release tag, e.g. v0.10.2-1.20.1'
        type: string
        required: false
      modrinth_version_type:
        description: 'Modrinth version type'
        type: choice
        options:
          - release
          - beta
          - alpha
        default: 'beta'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.isRelease == 'true' &&
      github.event.inputs.releaseTag != ''
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: litematica_container_filler_build.*
          path: all-jars

      - name: List downloaded files
        run: ls -R all-jars

      - name: Publish GitHub release
        uses: Kira-NT/mc-publish@v3.3.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          github-tag: ${{ github.event.inputs.releaseTag }}
          github-name: ${{ github.event.inputs.releaseTag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true
          files: all-jars/!(*-sources).jar

  publish_modrinth:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.isRelease == 'true' &&
      github.event.inputs.releaseTag != ''
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          pattern: litematica_container_filler_build.*
          path: branch-jars

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          modrinth-id: miuEbr4p
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ${{ github.event.inputs.releaseTag }}
          version: ${{ github.event.inputs.releaseTag }}
          version-type: ${{ github.event.inputs.modrinth_version_type }}
          loaders: fabric
          game-versions: |
            1.20.1
          game-version-filter: none
          java: 17
          modrinth-featured: false
          modrinth-dependencies: |
            bEpr0Arc(required)
            GcWjdA9I(required)
          files: branch-jars/!(*-@(dev|sources|javadoc)).jar
          changelog: |
            Published from branch `1.20.1`.
            Full release notes: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.releaseTag }}
